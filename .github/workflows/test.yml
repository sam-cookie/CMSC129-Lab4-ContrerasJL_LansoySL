name: Run Tests

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install root dependencies
        run: npm install

      - name: Run unit tests
        run: npx jest tests/unit/ --passWithNoTests

      - name: Run integration tests
        run: npx jest tests/integration/ --passWithNoTests

      - name: Run system tests
        run: npx jest tests/system/ --passWithNoTests